name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      NPM_TAG: ${{ needs.validate.outputs.npm-tag }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: corretto
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          merge-multiple: true
          path: build/release
      - name: Check sealed bundle and unpublished npm version before uploading
        run: |
          node scripts/release-checks.js verify
          node scripts/release-checks.js registry
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload tested JAR and checksum without overwriting existing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "build/release/context-engine-$VERSION.jar" "build/release/context-engine-$VERSION.jar.sha256"
      - name: Re-download assets and compare with the tested local bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/downloaded
          gh release download "$RELEASE_TAG" --pattern "context-engine-$VERSION.jar" --pattern "context-engine-$VERSION.jar.sha256" --dir build/downloaded
          cmp "build/release/context-engine-$VERSION.jar" "build/downloaded/context-engine-$VERSION.jar"
          cmp "build/release/context-engine-$VERSION.jar.sha256" "build/downloaded/context-engine-$VERSION.jar.sha256"
          (cd build/downloaded && sha256sum -c "context-engine-$VERSION.jar.sha256")
      - name: Verify actual launcher cold download before npm publication
        run: |
          test ! -e build/launcher-download
          node -e 'require("./npm/lib/commands").run(["download"], require("./npm/package.json"), {cacheDir:"build/launcher-download"}).catch(e=>{console.error(e);process.exitCode=1})'
          cmp "build/release/context-engine-$VERSION.jar" "build/launcher-download/context-engine-$VERSION.jar"
          cmp "build/release/context-engine-$VERSION.jar.sha256" "build/launcher-download/context-engine-$VERSION.jar.sha256"
      - name: Publish the tested tarball with provenance
        working-directory: npm
        run: npm publish "../build/release/commerce-context-mcp-$VERSION.tgz" --ignore-scripts --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
