name: Validate release candidate

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      npm-tag:
        value: ${{ jobs.build.outputs.npm-tag }}
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      source-sha:
        value: ${{ jobs.build.outputs.source-sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      source-sha: ${{ steps.version.outputs.source-sha }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate version and wrapper integrity
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-checks.js version >> "$GITHUB_OUTPUT"
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/release-checks.js wrapper
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: corretto
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Java and knowledge regression, Java 21 JAR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew validateKnowledge bootJar "-Pversion=$VERSION" --no-daemon
      - name: npm regression
        working-directory: npm
        run: npm test
      - name: Stage and inspect the actual JAR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-checks.js stage
          java scripts/VerifyArtifact.java "build/release/context-engine-$VERSION.jar" "$VERSION" > build/release/runtime-inventory.tsv
      - name: Actual Java 21 MCP and version contract
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MCP_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: node npm/test/mcp-smoke.js "build/release/context-engine-$VERSION.jar"
      - name: Pack once and seal the tested bundle
        run: |
          cd npm
          npm pack --ignore-scripts --json --pack-destination ../build/release > ../build/release/npm-pack.json
          cd ..
          node scripts/release-checks.js seal
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
      - name: Upload candidate for runtime gates
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '21'
            node: '24'
          - os: windows-latest
            java: '21'
            node: '22'
          - os: windows-latest
            java: '21'
            node: '24'
          - os: ubuntu-24.04-arm
            node: '24'
            managedOnly: true
          - os: windows-11-arm
            node: '24'
            managedOnly: true
          - os: macos-15-intel
            node: '24'
            managedOnly: true
          - os: macos-15
            node: '24'
            managedOnly: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ !matrix.managedOnly }}
        with:
          java-version: ${{ matrix.java }}
          distribution: corretto
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: build/release
      - name: Verify identical bundle
        run: node scripts/release-checks.js verify
      - name: Verify direct JDK runtime compatibility
        if: ${{ !matrix.managedOnly }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MCP_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          java scripts/VerifyArtifact.java "build/release/context-engine-$VERSION.jar" "$VERSION" > "$RUNNER_TEMP/runtime-inventory.tsv"
          cmp build/release/runtime-inventory.tsv "$RUNNER_TEMP/runtime-inventory.tsv"
          node npm/test/mcp-smoke.js "build/release/context-engine-$VERSION.jar"
      - name: Launcher regression on runtime OS and Node
        working-directory: npm
        run: npm test
      - name: Real runtime concurrency and offline corruption repair without system Java
        run: node npm/test/runtime-smoke.js
      - name: Test packed launcher without system Java, Korean cache path and EOF
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MCP_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          PACKED="build/commerce-packed"
          mkdir -p "$PACKED"
          tar -xzf "build/release/commerce-context-mcp-$VERSION.tgz" -C "$PACKED"
          export MCP_LAUNCHER_ROOT="$PACKED/package"
          node npm/test/mcp-smoke.js "build/release/context-engine-$VERSION.jar"
