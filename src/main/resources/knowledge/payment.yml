schema-version: 1
domain: payment
governance:
  owner: commerce-context-maintainers
rules:
    - id: webhook-handling
      category: webhook
      title: "결제 웹훅 처리 원칙"
      summary: "PG사 웹훅은 이벤트별 인증·검증과 내구성 있는 인수를 짧게 완료한 뒤 계약에 맞는 성공 응답을 반환하고 비즈니스 처리는 비동기로 수행한다"
      severity: critical
      applicability:
        applies-when:
          - "PG사가 결제 결과를 HTTP 웹훅으로 전달한다."
        does-not-apply-when:
          - "PG 계약이 웹훅 외 별도의 신뢰 가능한 결과 조회·확정 절차만 사용하도록 규정한다."
        assumptions:
          - "성공 상태 코드와 응답 제한시간은 사용하는 PG사의 최신 공식 문서를 기준으로 한다."
        jurisdiction: KR
      guidance:
        - "패턴: 수신 → PG·이벤트별 출처와 진위 검증 → inbox/queue에 내구성 있게 저장 → PG 계약에 맞는 성공 응답 → 별도 워커 처리"
        - "컨트롤러에서 전체 비즈니스 후처리를 기다리지 말고, 내구성 있는 인수까지만 짧게 완료한다"
        - "서명이 제공되는 이벤트는 PG 공식 문서의 서명 알고리즘·원문 body·재전송 검증 절차를 따른다. 서명이 없는 이벤트는 계약상 secret 등 검증 수단 또는 인증된 조회 API로 결제 ID·주문·금액·상태를 확인하고, 수신 body만으로 승인 확정하지 않는다"
        - "이벤트 ID·거래 ID의 고유 범위를 PG·상점·이벤트 유형별로 정의한다. 같은 결제의 승인·부분 취소 등 서로 다른 거래를 결제 번호 하나로 모두 중복 제거하지 않는다"
        - "같은 업무 효과를 알리는 서로 다른 이벤트도 거래 원장의 업무키와 조건부 상태 전이로 한 번만 반영한다. 역순 이벤트는 발생 순서·현재 조회 결과·원 거래를 대사한다"
      avoid-patterns:
        - "inbox/queue 저장 전에 성공 응답 — 응답 직후 장애가 나면 이벤트 영구 유실 가능"
        - "전체 주문·결제 후처리가 끝날 때까지 응답 지연 — PG 재전송과 중복 처리 증가"
        - "이벤트별 진위 검증 누락 — 제공되는 서명·secret 검증이나 인증된 조회 없이 외부 body로 결제 완료 처리"
        - "멱등성 처리 누락 — PG사 재전송 시 중복 결제 완료 처리"
      checklist:
        - "성공 응답 전에 계약상 필요한 검증과 내구성 있는 저장이 완료되는가?"
        - "성공 상태 코드와 응답 제한시간이 PG 공식 계약과 일치하는가?"
        - "이벤트별 서명·secret 또는 인증된 조회 검증이 계약에 맞는가?"
        - "웹훅 중복 수신 방어 (멱등성 처리)가 있는가?"
        - "같은 결제의 다른 거래와 동일 거래를 알리는 복수 이벤트를 구분하는가?"
      tags: [webhook, async, signature, idempotency, security]
      aliases: [결제 콜백, payment callback, callback signature, PG callback, 콜백 위조, 웹훅 위조]

    - id: payment-status-machine
      category: state-machine
      title: "결제 상태 머신과 전이 가드"
      summary: "결제 상태는 유한 상태 머신으로 정의하고 각 전이에 가드 조건을 반드시 적용해야 중복 결제와 잘못된 상태 전이를 막을 수 있다"
      guidance:
        - "결제 시도 상태 예시: PENDING → PROCESSING → PAID | FAILED | UNCERTAIN | CANCELLED. 주문 상태와 승인·환불 거래 상태를 분리하고 PG 상태는 계약에 맞게 매핑한다"
        - "UNCERTAIN은 검증된 웹훅·인증된 조회·대사 워커 등 허용된 경로로 확정한다. 사용자의 성공 주장만으로 변경하지 않으며, 과거 이벤트로 최신 상태를 덮지 않는다"
        - "환불 거래는 원 결제를 참조해 REQUESTED·PROCESSING·SUCCEEDED·FAILED·UNCERTAIN 등을 별도로 기록한다. 원 결제 요약은 PAID·PARTIAL_CANCELLED·REFUNDED 등으로 집계한다"
        - "전이 가드 — 결제 가능한 주문에서 활성 결제 시도를 원자적으로 선점한다. 같은 시도의 중복 실행을 막고 확정 실패 후 새 시도는 별도로 생성한다"
        - "전이 가드 — PAID 또는 PARTIAL_CANCELLED 등 허용 상태에서 잔여 환불 가능액과 처리 중 환불을 검사한다. 부분 환불 후에도 잔액 범위 안의 추가 환불을 허용한다"
        - "취소 의사와 실제 승인·취소 결과는 다르다. 취소와 늦은 승인 경합은 원 거래 조회·조건부 전이·멱등 보상으로 대사하고 취소 의사를 지우지 않는다"
        - "상태 전이는 낙관락(@Version) 또는 CAS로 원자적 처리 — 동시 요청이 같은 전이를 중복 실행 방지"
        - "허용되지 않는 전이 요청은 즉시 IllegalStateException 등 명확한 예외 반환"
      avoid-patterns:
        - "상태 검증 없이 결제 요청 — 이미 PAID인 주문에 중복 결제 시도 발생"
        - "PAID → PENDING 역방향 전이 허용 — 결제 완료된 주문을 재결제 가능 상태로 되돌림"
        - "UNCERTAIN 상태 미구현 — 망취소 응답 불명확 시 영구 PENDING 방치"
        - "전이 로직을 여러 서비스에 분산 — 상태 전이 규칙 불일치로 정합성 파괴"
      checklist:
        - "결제 요청 전 주문과 결제 시도의 허용 상태를 검증하는가?"
        - "미확정 결제 시도를 검증된 웹훅·조회·대사로 확정하는가?"
        - "잘못된 전이 시도에 적절한 예외를 반환하는가?"
        - "상태 전이가 낙관락(@Version) 또는 CAS로 원자적으로 처리되는가?"
        - "환불 요청 전 허용 상태와 잔여 환불 가능액·처리 중 금액을 원자적으로 검증하는가?"
      tags: [state-machine, payment-status, transition, guard, concurrency]

    - id: duplicate-payment-guard
      category: duplicate
      title: "중복 결제 방어"
      summary: "결제 버튼 중복 클릭·네트워크 재시도로 인한 이중 결제를 상태·시도 식별자·외부 거래 ID·동시성 제어로 다층 방어한다"
      severity: high
      applicability:
        applies-when:
          - "외부 결제 승인 요청이 사용자 중복 동작이나 네트워크 재시도로 다시 전송될 수 있다."
        does-not-apply-when:
          - "결제 수단이나 사업자 계약이 별도의 중복 방지·승인 확정 절차만 허용하면 해당 계약을 우선한다."
        assumptions:
          - "멱등성 키의 지원 여부, 전달 위치와 보장 기간은 사용하는 결제사업자의 최신 공식 문서로 확인한다."
        jurisdiction: KR
      guidance:
        - "외부 승인 전 주문의 결제 가능 상태와 활성 결제 시도를 DB 조건부 갱신·UNIQUE 등으로 원자적 선점한다. 선조회 후 승인하거나 승인 후 낙관락만 검사해서는 외부 이중 승인을 막지 못한다"
        - "결제사업자가 멱등성 기능을 제공하면 공식 계약의 헤더·필드와 재사용 규칙에 따라 같은 논리적 시도에 같은 키를 전달한다"
        - "외부 멱등성 기능이 없더라도 내부 결제 시도 ID와 상태 전이 가드로 동일 시도의 중복 실행을 차단한다"
        - "결제 시도에 금액·통화·수단 등 요청 지문과 결과를 저장한다. 같은 키의 다른 요청은 거부하고 처리 중·미확정이면 새 승인을 보내기 전에 기존 결과를 조회한다"
        - "PG 거래 ID는 상점·사업자별 고유 범위에 맞는 DB UNIQUE 제약으로 저장한다. 중복 선조회만으로 동시 삽입을 방어하지 않는다"
        - "낙관락(@Version) 또는 CAS는 내부 상태 전이를 보호한다. 외부 멱등성 지원이 없으면 미확정 요청을 자동 재승인하지 않고 사업자 조회·대사로 확인한다"
        - "승인·취소 결과는 인증된 조회·검증된 웹훅으로 확인한다. 중복 승인 보상도 원 거래에 연결한 별도 업무로 영속 선점하고, 같은 보상의 재시도는 동일 키로 멱등하게 처리한다. 보상 결과가 미확정이면 조회·대사하고 새 키로 취소·환불을 반복하지 않는다"
      avoid-patterns:
        - "주문 상태 검증 없이 결제 요청 — 이미 결제된 주문에 중복 결제 발생"
        - "결제사업자의 중복 방지 계약과 내부 상태 가드가 모두 없음 — 네트워크 재시도 시 실제 결제 중복 가능"
      checklist:
        - "외부 승인 전 결제 가능한 주문의 활성 시도를 원자적으로 선점하는가?"
        - "결제사업자가 제공하는 멱등성 기능의 전달 방식과 보장 범위를 공식 문서로 확인했는가?"
        - "동시 결제 요청에 낙관락(@Version) 또는 상태 CAS 처리가 있는가?"
        - "같은 키의 요청 지문을 대조해 다른 요청을 거부하고, 승인뿐 아니라 취소·보상도 멱등하게 처리하는가?"
      tags: [duplicate, idempotency, optimistic-lock, payment-status]
      aliases: [이중 결제, 두 번 결제, 결제 두번, 돈이 두 번 빠짐, double payment, 중복 승인]

    - id: network-cancellation
      category: network-cancel
      title: "망취소 처리 (결제 응답 불명확 상황)"
      summary: "결제 응답을 받지 못한 상황은 미확정 상태로 기록하고 결제사업자의 조회·망취소 계약에 따라 비동기로 최종 상태를 확인한다"
      severity: high
      applicability:
        applies-when:
          - "결제 승인 요청 후 timeout, 연결 종료 또는 응답 유실로 승인 결과를 확정할 수 없다."
        does-not-apply-when:
          - "결제사업자가 동기 응답 외의 별도 상태 확인이나 취소 절차를 제공하지 않는 경우 계약에 따른 예외 처리가 필요하다."
        assumptions:
          - "조회 가능 시점, 망취소 지원 여부와 최종 상태 값은 결제사업자 공식 문서를 기준으로 한다."
        jurisdiction: KR
      guidance:
        - "결제 요청 직전에 DB에 결제 시도 ID·요청 지문·PENDING 상태를 기록한다"
        - "응답 타임아웃은 해당 결제 시도를 UNCERTAIN으로 기록한다. 주문·예약 상태와 취소 의사는 별도로 보존하고 미확정 결과만으로 재고를 무조건 해제하지 않는다"
        - "스케줄러나 재처리 워커가 계약상 허용된 시점에 인증된 조회 API를 호출하거나 검증된 웹훅으로 원 시도를 확인한다. 결제 ID·주문·금액·통화를 대조하고 검증되지 않은 수신 body만으로 확정하지 않는다"
        - "결제사업자 응답을 내부 상태에 매핑하고 성공·실패·취소·계속 미확정 상태를 구분한다"
        - "일정 시간 후 자동 취소할지는 결제사업자의 망취소 계약과 내부 보상 정책으로 결정한다"
        - "주문 취소와 늦은 승인 경합은 원 시도를 조회하고, 승인·취소 결과에 따라 주문 확정 또는 멱등 보상한다. 보상은 원 거래와 보상 업무키·요청 지문을 영속 연결하고 같은 보상의 재시도에 동일 키를 사용한다. 보상 결과도 미확정이면 조회·대사하며 새 키로 재승인하거나 이미 해제한 재고를 중복 복구하지 않는다"
        - "가상계좌는 입금 대기·입금 기한·입금 취소를 구분한다. 기한 만료 후 입금 통지는 실제 거래와 주문·재고를 대사하고 수락·환불 등 계약상 경로로 처리한다"
      avoid-patterns:
        - "망취소 상태 주문 방치 — 재고가 예약된 채 고객에게 서비스 불가"
        - "응답 불명확 상태와 후속 조회·망취소 절차를 구현하지 않아 주문이 영구 미확정으로 남음"
      checklist:
        - "망취소 상황 (응답 타임아웃) 처리 로직이 있는가?"
        - "미확정 결과를 인증된 조회·검증된 웹훅으로 확인하고, 취소·보상의 재시도도 멱등하게 처리하는가?"
      tags: [network-cancel, timeout, scheduler, payment-status, uncertainty]
      aliases: [망취소, 결제 응답 유실, unknown payment, 승인 결과 불명, 카드 승인 타임아웃]

    - id: partial-refund
      category: refund
      title: "부분 취소 / 환불 처리"
      summary: "부분 취소는 같은 환불의 요청 내용·한도를 원자적으로 검증하고, 주문 시점의 할인 배부 정책과 반올림 규칙으로 환불액을 재현해 정산 상태와 대사한다"
      severity: high
      guidance:
        - "동일 환불을 식별하는 업무키는 UUID·전역 순번 또는 (상점, 업무 종류, 원 업무일자, 순번) 등 고유 범위가 확보된 식별자다. 원래 키를 영속 저장해 자정이 지난 재시도에도 유지하며, 요청마다 날짜·순번·UUID를 재발급해 같은 환불을 새 거래로 만들지 않는다"
        - "같은 키에 원 결제·환불 대상·금액·통화 등 요청 지문을 대조하고 다른 요청은 거부한다. 동일 환불의 재전송에는 기존 상태·결과를 반환하며, 금액이 같더라도 서로 다른 정상 부분 환불은 별도 업무키로 기록한다"
        - "원자적 잔액 확보로 확정 성공 누적 환불액 + 처리 중·미확정 환불액 + 새 요청액 ≤ 원 결제액을 검증한다. 같은 키의 동시 요청도 UNIQUE·조건부 상태 전이 등으로 환불 생성·금액 확보를 같은 로컬 트랜잭션에서 한 번만 반영한다"
        - "환불 성공은 확보액을 확정으로 옮기고 확정 실패만 해제한다. 응답 유실은 같은 환불의 인증된 조회·검증된 웹훅으로 원 결제·환불 거래·금액을 대사하며, 시간 경과만으로 실패 처리하지 않는다. 남은 라인·배송비·세금·결제 수단별 환불 가능액도 초과하지 않는다"
        - "환불·취소·보상도 각 논리적 업무의 키와 요청 지문을 영속 보관하고 외부 멱등성·조회 계약에 맞춰 재처리한다. 결과 미확정이나 외부 키 보존 기간 만료를 이유로 새 키를 발급해 재실행하지 않는다"
        - "출고 전 취소는 확보한 수량을 해당 재고 모델에 맞게 한 번 해제·복구한다. 출고 후 반품은 회수·검수 결과로 판매 가능 재고 복구 여부를 결정하며 환불 성공만으로 불량 재고를 판매 가능하게 만들지 않는다"
        - "주문 확정 시 쿠폰·포인트 할인액을 주문 라인에 배부하고 배부 정책·반올림·잔여 오차 귀속을 스냅샷으로 저장"
        - "부분 취소 환불액은 저장된 라인별 실결제액을 기준으로 계산한다. 단순 비례 배분은 선택 가능한 정책 중 하나이며 모든 쿠폰에 일괄 적용하지 않는다"
        - "이미 정산된 거래의 환불이 차기 정산 공제, 별도 출금 등 어떤 절차를 따르는지 계약을 확인한다"
        - "부분 취소 후 혜택 유지·회수·일부 회수는 주문 당시 정책과 배부 스냅샷을 따른다. 반복 환불의 반올림 잔차는 누적 배부 결과와 대사해 합계를 보존한다"
        - "사용 포인트 복원과 적립 포인트 회수는 별도 원 거래로 기록한다. 이미 사용·만료된 원천과 음수 잔액 처리도 정책에 따라 결정한다"
      avoid-patterns:
        - "쿠폰/포인트 환불 금액 역산 누락 — 환불액 과부족 발생"
        - "정산 완료 여부와 계약상 환불·공제 절차를 확인하지 않고 환불 처리"
        - "동시 부분 환불이 각각 같은 잔액을 조회한 뒤 원자적 확보 없이 실행돼 원 결제액을 초과"
        - "재시도마다 새 날짜·순번을 생성하거나, 같은 키의 다른 요청을 검증 없이 기존 결과로 처리"
      checklist:
        - "같은 환불 업무키를 재시도에도 유지하고, 요청 지문이 다른 요청은 거부하는가?"
        - "환불의 미확정 결과를 인증된 조회·검증된 웹훅으로 확인하고 취소·보상도 멱등하게 처리하는가?"
        - "부분 취소 시 쿠폰/포인트 환불 금액을 역산하는가?"
        - "정산 완료 후 환불의 공제·출금 절차가 계약에 맞는가?"
        - "환불 요청 전 허용 상태와 잔여 환불 가능액·처리 중 금액을 원자적으로 검증하는가?"
        - "반복 환불의 배부 잔차와 출고 전 취소·반품 검수의 재고 복구가 구분되는가?"
      tags: [partial-refund, coupon, point, settlement, refund-calculation]
      aliases: [할인 쿠폰 환불 배분, 부분 환불 prorate, coupon allocation refund, 카드 취소액, 쿠폰 복원, 예약 환불]
      evidence:
        - title: "AWS Builders' Library — Making retries safe with idempotent APIs"
          url: "https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/"
          type: official-documentation
          accessed-at: 2026-10-21
          note: "동일 요청 식별자·요청 내용 불일치 검증의 설계 참고다. PG별 환불 계약이나 할인·정산 산식을 입증하는 자료는 아니다."

    - id: payment-idempotency
      category: idempotency
      title: "결제 API 멱등성 키 설계"
      summary: "업무키는 UUID뿐 아니라 날짜·순번 등의 고유 범위가 확보된 식별자도 가능하며, 같은 시도의 재시도에 유지하고 요청 내용을 검증한다. 외부 멱등키는 PG 계약에 맞춰 연결한다"
      severity: high
      guidance:
        - "업무키는 같은 논리적 업무를 구분하는 식별자다. UUID·전역 순번 또는 (상점, 업무 종류, 원 업무일자, 순번) 등의 복합키를 사용할 수 있으며, 고유 범위와 저장된 요청 지문으로 업무를 식별한다"
        - "동일한 논리적 결제 시도의 네트워크 재전송은 영속 저장한 같은 키를 사용해 기존 상태·결과를 재사용한다. 자정이 지나도 원 업무일자를 유지하고 날짜·순번·UUID를 재발급하지 않는다"
        - "같은 키의 금액·통화·원 주문 등 요청 지문을 대조하고 다른 요청은 거부한다. 금액이나 요청 내용이 같다는 이유만으로 서로 다른 정상 업무를 하나로 합치지 않는다"
        - "순번이 일자·상점·작업별로 초기화되면 그 범위를 키와 UNIQUE 제약에 포함한다. 날짜만으로도 해당 고유 범위에서 하루 한 업무가 보장된다면 사용할 수 있지만, 같은 날 여러 업무가 있으면 구분자가 더 필요하다"
        - "내부 업무키와 외부 멱등키는 별개로 관리할 수 있다. PG 계약의 문자·길이·무작위성·고유 범위에 맞는 외부 키를 한 번 생성해 내부 업무키와 영속 매핑하고 재사용한다. 내부 복합키를 모든 PG에 그대로 보낼 수 있다고 단정하지 않는다"
        - "결제 실패가 확정되어 사용자가 명시적으로 새 결제 시도를 시작할 때만 attempt를 증가시키거나 새 키를 발급한다"
        - "주문 단위 키 예시: \"payment:{orderId}:{attempt}\""
        - "또는 UUID v4를 논리적 결제 시도 생성 시 한 번 생성해 DB에 저장한다. 요청마다 새 UUID를 생성하는 방식과 구분한다"
        - "외부 전달 헤더나 필드 이름은 결제사업자의 공식 문서를 따른다"
        - "같은 키 재요청의 응답과 처리 보장은 결제사업자마다 다르므로 공식 문서의 의미와 보존 기간을 확인한다"
        - "키 보존 기간은 PG사 중복 요청 보장 기간과 내부 재시도·분쟁 조회 기간을 기준으로 정한다"
        - "외부 키의 보존 기간이 끝나도 내부 업무키·원 거래 이력을 대사한다. 결과가 미확정이면 새 외부 키를 만들어 같은 결제를 재승인하지 않는다"
      avoid-patterns:
        - "응답이 불명확한데 새 키로 재요청 — 기존 결제가 성공한 경우 이중 결제 가능"
        - "확정 실패와 네트워크 타임아웃을 구분하지 않고 항상 같은 키 또는 항상 새 키를 사용"
        - "멱등성 키 미사용 — 네트워크 오류로 같은 결제 요청이 2번 전달되면 이중 결제 발생"
      checklist:
        - "동일 결제 시도의 재전송과 명시적인 새 결제 시도를 구분하는가?"
        - "고유 범위가 확보된 원 업무일자·순번·UUID 등의 업무키를 재시도에도 유지하고 같은 키의 다른 요청을 거부하는가?"
        - "내부 업무키와 PG 계약에 맞는 외부 멱등키의 매핑을 영속 보관하는가?"
      tags: [idempotency, payment-key, retry, pg]
      aliases: [결제 업무키, 결제 복합키, 결제 일자 순번, 결제 날짜 seq]
      evidence:
        - title: "AWS Builders' Library — Making retries safe with idempotent APIs"
          url: "https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/"
          type: official-documentation
          accessed-at: 2026-10-21
          note: "호출자 범위의 요청 식별·파라미터 대조·원자적 반영에 관한 설계 참고다. 특정 키 형식을 모든 PG의 계약으로 일반화하지 않는다."
        - title: "토스페이먼츠 API — 인증 및 기타 헤더 설정"
          url: "https://docs.tosspayments.com/reference/using-api/authorization"
          type: official-documentation
          accessed-at: 2026-10-21
          note: "토스페이먼츠의 인증·멱등키 규격 확인용 예시다. 무작위 고유값 권고와 보장 범위·기간은 해당 사업자의 계약이며 다른 PG나 내부 업무키의 공통 규격이 아니다."

    - id: payment-ai-pitfalls-checklist
      category: checklist
      title: "결제 구현 체크리스트"
      summary: "결제 구현 완료 후 반드시 점검할 체크리스트"
      checklist:
        - "결제 상태 머신의 모든 전이에 가드 조건이 정의됐는가?"
        - "미확정 결제 시도를 검증된 웹훅·조회·대사로 확정하는가?"
        - "잘못된 전이 시도에 적절한 예외를 반환하는가?"
        - "웹훅 성공 응답 전에 계약상 필요한 검증과 내구성 있는 저장이 완료되는가?"
        - "이벤트별 서명·secret 또는 인증된 조회 검증이 계약에 맞는가?"
        - "웹훅 중복 수신 방어 (멱등성 처리)가 있는가?"
        - "외부 승인 전 결제 가능한 주문의 활성 시도를 원자적으로 선점하는가?"
        - "결제사업자의 멱등성 지원 여부를 확인하고 공식 계약에 맞게 사용하는가?"
        - "망취소 상황 (응답 타임아웃) 처리 로직이 있는가?"
        - "부분 취소 시 쿠폰/포인트 환불 금액을 역산하는가?"
        - "정산 완료 후 환불의 공제·출금 절차가 계약에 맞는가?"
        - "동일 결제 시도의 재전송과 명시적인 새 결제 시도를 구분하는가?"
        - "동시 결제 요청에 낙관락(@Version) 또는 상태 CAS 처리가 있는가?"
        - "환불 요청 전 허용 상태와 잔여 환불 가능액·처리 중 금액을 원자적으로 검증하는가?"
        - "같은 결제의 다른 거래와 동일 거래를 알리는 복수 이벤트를 구분하는가?"
        - "같은 환불 업무키를 재시도에도 유지하고, 요청 지문이 다른 요청은 거부하는가?"
        - "환불의 미확정 결과를 인증된 조회·검증된 웹훅으로 확인하고 취소·보상도 멱등하게 처리하는가?"
      tags: [checklist, pitfalls, review, payment]
      aliases: [결제 체크리스트, 결제 점검표, payment checklist]
