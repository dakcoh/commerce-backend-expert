schema-version: 1
domain: coupon
governance:
  owner: commerce-context-maintainers
rules:
    - id: coupon-validation
      category: validation
      title: "쿠폰 유효성 검증 핵심 항목"
      summary: "쿠폰 적용 전 유효 기간·사용 조건·중복 사용·발급 대상을 서버 측에서 모두 검증해야 한다"
      guidance:
        - "유효 기간: 발급일 기준 만료 여부 — 서버 시간 기준, 클라이언트 시간 믿지 말 것"
        - "사용 대상 조건: 특정 카테고리/상품/최소 주문금액 제한 여부 확인"
        - "중복 사용 여부: 이미 사용된 쿠폰인지 확인 (쿠폰 상태: ISSUED → USED)"
        - "1인 사용 한도: 동일 쿠폰 코드를 동일 유저가 여러 번 사용하는 시나리오 방어"
        - "발급 대상 검증: 특정 유저에게만 발급된 쿠폰을 타인이 사용하는 시나리오 방어"
        - "쿠폰 상태 업데이트 시 낙관락 또는 CAS(Compare-And-Swap) 처리 — 동시 요청으로 중복 사용 방지"
      avoid-patterns:
        - "클라이언트 만료 시간 신뢰 — 서버 시간 기준으로 반드시 재검증"
        - "동시성 제어 없이 쿠폰 상태 업데이트 — 동시에 같은 쿠폰 적용 요청 시 중복 사용 가능"
      checklist:
        - "쿠폰 유효 기간을 서버 시간 기준으로 검증하는가?"
        - "쿠폰 적용 대상 조건(카테고리/상품/최소금액)을 검증하는가?"
        - "쿠폰 중복 사용 방지 (상태 USED 확인)가 있는가?"
        - "쿠폰 상태 업데이트 시 동시성 제어(낙관락/CAS)가 있는가?"
      aliases: [쿠폰 유효성, 쿠폰 사용 조건, 쿠폰 중복 사용, coupon validation]
      tags: [coupon, validation, expiry, duplicate-use, concurrency]

    - id: coupon-discount-calculation
      category: calculation
      title: "쿠폰 할인 금액 계산 — 복잡도 높은 케이스"
      summary: "정률 할인의 cap 처리, 복수 쿠폰 적용 순서, 부분 취소 역산까지 정책을 명확히 정의해야 한다"
      applicability:
        applies-when:
          - "정률·정액 쿠폰, 포인트 또는 부분 취소가 주문 할인과 환불 계산에 영향을 준다."
        assumptions:
          - "할인 순서·배부·반올림·혜택 회수 조건은 주문 시점의 정책 버전과 스냅샷을 따른다."
      guidance:
        - "정률 할인 cap(최대 할인 금액) 처리: 예) 20% 할인, 최대 5,000원 → 50,000원 주문 시 할인액 = min(10,000, 5,000) = 5,000원"
        - "복수 쿠폰 적용 순서: 정률→정액 또는 정액→정률 등 정책에 따라 최종 할인액이 달라진다. 적용 순서와 정책 버전을 주문 스냅샷에 저장한다"
        - "플랫폼 정책으로 쿠폰 중복 적용 가능 여부 정의 필요"
        - "쿠폰 + 포인트 병행 사용: 쿠폰 할인 후 잔액에 포인트 적용인지 원금에 적용인지 정책 확인 필수"
        - "주문 시점에 주문 라인별 할인·부담 주체·반올림 잔차를 배부하고 스냅샷을 저장한다. 배부 합계는 실제 적용한 총 할인액과 일치해야 한다"
        - "부분 취소는 저장된 배부 결과와 정책으로 역산한다. 최소 주문금액 미달 시 혜택 유지·회수·부분 회수 여부를 정책에 따라 결정하며, 모든 쿠폰에 단순 비례 배부나 자동 회수를 요구하지 않는다"
      avoid-patterns:
        - "정률 할인 cap 처리 누락 — 최대 할인 금액 초과 발생"
        - "복수 쿠폰 적용 순서 미정의 — 최종 할인액이 정책과 달라짐"
        - "현재 정책으로 과거 주문을 다시 계산하거나, 혜택 유지 정책인데 최소금액 미달만으로 할인액을 회수"
      checklist:
        - "정률 할인의 최대 할인 금액 캡(cap)이 처리됐는가?"
        - "복수 쿠폰 적용 순서와 정책 버전을 주문 시점에 저장하는가?"
        - "부분 취소 시 배부 스냅샷과 혜택 유지·회수 정책으로 할인액을 재현하는가?"
      tags: [coupon, discount, calculation, partial-cancel, point]

    - id: coupon-issuance
      category: issuance
      title: "선착순 쿠폰 발급 — 동시성 제어"
      summary: "선착순 쿠폰 발급은 재고 확인과 사용자 중복 선점을 하나의 원자적 연산으로 처리하고 DB 제약으로 최종 방어한다"
      severity: high
      guidance:
        - "DB 조건부 수량 갱신과 발급 업무키 UNIQUE를 같은 트랜잭션에서 처리하는 DB-only 방식도 가능하다. 확보 성공 여부와 양수 수량·총 한도를 함께 검증한다"
        - "Redis 사용 시 재고 확인·감소와 사용자 중복 선점을 하나의 Lua Script로 처리한다. DECR와 SETNX를 애플리케이션에서 따로 호출하면 전체 흐름은 원자적이지 않다"
        - "DB 비관락: SELECT ... FOR UPDATE → 발급 수량 체크 + 업데이트 원자적 처리 (단: 트래픽 폭주 시 DB 커넥션 소진 위험)"
        - "메시지 큐 (비동기 발급): 발급 요청 → 큐 적재 → 워커가 순차 처리 (장점: DB 부하 분산 / 단점: 즉시 발급 피드백 불가)"
        - "이중 발급 방어: 1인 1매 캠페인은 userId + campaignId 등을 업무키로 사용할 수 있다. couponId가 캠페인인지 개별 발급권인지 정의하고, 회차별 발급·1인 N매 한도는 그 자격 범위에 맞춰 제약과 원자적 수량 검증을 설계한다"
      avoid-patterns:
        - "동시성 제어 없이 발급 수량만 체크 — 동시 요청 폭주 시 오버이슈 발생"
        - "발급 업무키·사용자 한도·원자적 수량 제어 없이 사용자 중복 여부만 선조회"
      checklist:
        - "선착순 쿠폰 발급 시 오버이슈 방지 로직이 있는가?"
        - "발급 자격·회차·사용자 한도에 맞춘 업무키 제약과 원자적 수량 검증이 있는가?"
      tags: [coupon, issuance, concurrency, redis, queue, oversue]

    - id: coupon-issuance-compensation
      category: issuance
      title: "선착순 쿠폰 발급 — Redis 선점 + DB 확정 + 보상 처리"
      summary: "Redis 선점 + DB 확정 모델을 선택했다면 영속 attempt와 원장 대사로 중간 장애를 추적하고, DB 실패가 확정된 선점만 원자적·멱등적으로 보상한다"
      severity: high
      applicability:
        applies-when:
          - "발급 접수에 Redis를 사용하고 DB 원장에 최종 발급을 확정하는 모델을 선택했다."
        does-not-apply-when:
          - "DB 조건부 갱신·행 잠금·업무키 제약만으로 수량과 중복 발급을 제어하는 DB-only 모델을 선택했다."
        assumptions:
          - "Redis와 DB는 하나의 원자적 트랜잭션이 아니며 DB commit 응답 유실과 프로세스 중단을 구분한다."
      guidance:
        - "선점 전에 attempt 식별자와 발급 업무키를 영속 저장하고 Redis 선점 기록을 연결한다. 메모리의 reserved boolean만으로는 프로세스 중단 후 상태를 복구할 수 없다"
        - "1단계 Redis 선점: 하나의 Lua Script에서 자격·사용자 한도·재고를 확인하고 수량 감소와 선점 토큰 저장을 원자적으로 처리한다"
        - "2단계 DB 저장 (@Transactional): 발급 원장과 자격 범위에 맞는 업무키 제약으로 최종 이중 발급을 방어한다"
        - "3단계 성공 확정: Redis 선점 성공 + DB 저장 성공 = 발급 확정"
        - "DB commit 응답 유실이나 중복키 오류는 동일 attempt와 원장을 조회해 성공·실패·미확정을 구분한다. 이미 발급 성공한 요청을 실패로 오인해 수량을 되돌리지 않는다"
        - "4단계 DB 실패 확정 시 Lua Script 보상: 현재 선점 토큰이 해당 attempt와 일치하고 아직 보상되지 않은 경우에만 선점 제거와 INCR을 함께 수행한다"
        - "SREM 성공 시에만 INCR하는 방식도 이전 시도의 늦은 보상이 새 선점을 지우지 않도록 선점 토큰·상태 검증이 필요하다"
        - "프로세스 중단·보상 실패·장기 미확정 attempt는 DB 원장과 Redis 수량을 대사하고, 재시도 상한·복구 작업·운영 알림으로 추적한다"
      avoid-patterns:
        - "무조건 INCR 보상 — 중복 보상 시 재고 원본보다 증가 (원래 100 → 보상 2회 → 101)"
        - "DB @Transactional rollback으로 Redis 자동 복구 기대 — Redis는 DB 트랜잭션 범위 밖"
        - "보상 로직 누락 — DB 실패 후 Redis 선점 상태 방치, 재고 영구 손실"
        - "Redis 유무만으로 발급 안전성을 판단하거나 DB-only 모델의 원자적 갱신·제약을 무시"
        - "DB 결과가 미확정인데 즉시 보상하거나, 이전 시도의 선점 토큰으로 새 시도의 선점을 제거"
      checklist:
        - "Redis+DB 모델이라면 선점과 영속 attempt·DB 발급 원장을 연결해 대사할 수 있는가?"
        - "DB 응답 유실과 확정 실패를 구분한 뒤 해당 선점만 복구하는가?"
        - "Redis 사용 시 보상은 선점 토큰 검증과 수량 복구를 원자적·멱등적으로 처리하는가?"
        - "프로세스 중단·보상 실패 후에도 복구 작업과 운영 알림이 가능한가?"
      tags: [coupon, issuance, redis, compensation, saga, lua, idempotency]

    - id: promotion-rules
      category: promotion
      title: "프로모션 규칙 엔진 설계"
      summary: "프로모션은 우선순위·조합·버전을 명시하고, 규칙 규모와 운영 변경 요구에 따라 단순 코드·Strategy/Specification·DB 기반 규칙 엔진을 선택한다"
      guidance:
        - "작고 고정된 규칙은 명확한 조건문과 테스트로 관리할 수 있다. 조합 규모·변경 빈도·운영자 편집·감사 요구가 커지면 Strategy/Specification 또는 규칙 엔진을 비교한다"
        - "DB 기반 규칙은 지원하는 조건·할인 유형·우선순위·기간을 검증하고 정책 버전·활성화·롤백을 관리한다. 새로운 조건의 표현력을 추가할 때는 코드 변경이 필요할 수 있다"
        - "우선순위 기반 적용: 우선순위 높은 프로모션 먼저 적용, 중복 적용 여부는 플래그로 제어"
        - "프로모션 중복 적용 허용 시 최대 할인 한도 반드시 설정"
      avoid-patterns:
        - "규칙 규모와 운영 요구를 확인하지 않고 조건문 또는 규칙 엔진 중 하나를 무조건 강제"
        - "프로모션 중복 적용 시 최대 할인 한도 미설정 — 할인 금액 통제 불가"
      checklist:
        - "프로모션 중복 적용 시 최대 할인 한도가 설정됐는가?"
      tags: [promotion, rule-engine, strategy, specification, priority]

    - id: coupon-ai-pitfalls-checklist
      category: checklist
      title: "쿠폰·프로모션 구현 체크리스트"
      summary: "쿠폰/프로모션 구현 완료 후 반드시 점검할 체크리스트"
      checklist:
        - "선택한 발급 모델에서 총 수량·사용자 한도·중복 발급을 원자적으로 제어하는가?"
        - "Redis+DB 모델이라면 영속 attempt와 대사·멱등 복구 경로가 있는가?"
        - "쿠폰 유효 기간을 서버 시간 기준으로 검증하는가?"
        - "쿠폰 적용 대상 조건(카테고리/상품/최소금액)을 검증하는가?"
        - "쿠폰 중복 사용 방지 (상태 USED 확인)가 있는가?"
        - "쿠폰 상태 업데이트 시 동시성 제어(낙관락/CAS)가 있는가?"
        - "정률 할인의 최대 할인 금액 캡(cap)이 처리됐는가?"
        - "복수 쿠폰 적용 순서와 정책 버전을 주문 시점에 저장하는가?"
        - "선착순 쿠폰 발급 시 오버이슈 방지 로직이 있는가?"
        - "발급 자격·회차·사용자 한도에 맞춘 업무키 제약과 원자적 수량 검증이 있는가?"
        - "부분 취소 시 배부 스냅샷과 혜택 유지·회수 정책으로 할인액을 재현하는가?"
        - "프로모션 중복 적용 시 최대 할인 한도가 설정됐는가?"
      aliases: [쿠폰 체크리스트, 쿠폰 점검표, coupon checklist]
      tags: [checklist, coupon, promotion, pitfalls, review]
