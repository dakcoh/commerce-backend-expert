schema-version: 1
domain: settlement
governance:
  owner: commerce-context-maintainers
rules:
    - id: settlement-timing
      category: timing
      title: "정산 시점과 정산 기준일 처리"
      summary: "정산 산정 기준일·대상 기간·확정일과 예정 지급일·실제 지급일을 구분하고 영업일 조정은 계약상 해당 단계에만 적용한다"
      guidance:
        - "산정 기준일은 구매 확정·배송 완료·결제 완료 등 계약상 기준 이벤트로 정하고, 정산 대상 기간·확정일·예정 지급일·실제 지급일은 각각 기록한다"
        - "주말 거래의 산정 기준일을 은행 영업일로 무조건 옮기지 않는다. 주말/공휴일 조정은 계약이 정한 확정 또는 지급 단계와 영업일 달력에 적용한다"
        - "기준 기간은 업무 타임존과 시작 포함·끝 제외 경계를 명시하고 원 거래 시각과 수집 시각을 구분한다"
        - "부분 취소·지연 유입·기준 기간 종료 후 반품은 원 거래를 참조한 보정과 적용 주기를 계약에 따라 결정한다"
      avoid-patterns:
        - "환불 가능 기간 전 지급하는 계약인데도 후속 반품 보정·회수 경로를 정의하지 않음"
        - "산정 기준일과 지급일을 혼동하거나 계약상 영업일 조정을 누락"
        - "부분 취소된 주문의 정산 금액 재계산 누락"
      checklist:
        - "정산 기준일 유형(구매 확정/배송 완료/결제 완료)이 명확히 정의됐는가?"
        - "산정 기준일·확정일·예정/실제 지급일과 영업일 조정 정책이 구분되는가?"
      tags: [settlement, timing, purchase-confirm, delivery]

    - id: settlement-deduction
      category: deduction
      title: "정산 공제 항목 처리"
      summary: "정산 공제는 판매금액의 포함 항목과 부담 주체·적용 정책을 정의해 중복 차감을 막고 지급 후 반품·음수 잔액을 원 거래에 연결한다"
      guidance:
        - "정산 확정 순액은 계약상 매출 기초액에 판매자 귀속 배송비 등을 더하고 아직 반영하지 않은 반품·수수료·판매자 부담 할인 등을 공제한다. 할인·세금이 이미 포함된 기초액인지 정의해 중복 공제하지 않는다"
        - "수수료와 분담금은 원 거래에 적용되는 계약·정책 버전과 계산 기준을 저장한다. 과거 거래를 현재 요율로 무조건 재계산하지 않는다"
        - "지급 전후 반품은 원 거래·원 명세·원 지급을 참조하는 보정 원장으로 기록한다. 다음 주기 공제·상계·별도 회수 등은 계약에 따라 선택하며 확정 명세를 덮어쓰지 않는다"
        - "프로모션 분담금: 플랫폼 부담분 vs 셀러 부담분 비율 계산 필요"
        - "쿠폰 분담금은 발행 주체와 실제 비용 부담 주체를 구분해 주문 당시 부담 배부를 따른다"
        - "공제 후 금액이 음수(-)가 될 수 있음 → 다음 정산 주기로 이월하거나 셀러에게 별도 청구"
      avoid-patterns:
        - "공제 후 음수 케이스 미처리 — 정산액 오류 발생"
        - "쿠폰/프로모션 분담금 비율 미계산 — 정산액 불일치"
      checklist:
        - "이미 정산·지급된 건의 반품을 원 거래와 연결해 계약상 보정·상계·회수하는가?"
        - "쿠폰/프로모션 분담금 비율 계산 로직이 있는가?"
        - "정산 공제 후 음수 발생 케이스가 처리됐는가?"
      tags: [settlement, deduction, fee, refund, promotion]

    - id: settlement-cycle
      category: cycle
      title: "정산 주기와 배치 처리"
      summary: "정산 배치는 멱등성·페이징·재시작 지점을 반드시 구현해 중복 정산과 OOM을 방지해야 한다"
      severity: high
      applicability:
        applies-when: ["정산 대상 거래를 배치로 확정하며 동시 실행·재시작이 같은 업무 효과를 중복 반영할 수 있다."]
        assumptions: ["실행 ID와 정산 업무키를 구분하고 확정 내역과 체크포인트의 커밋 경계를 검증한다."]
      guidance:
        - "일반적인 정산 주기: 일 정산, 주 정산, 월 정산"
        - "멱등성 보장: 재실행에도 바뀌지 않는 업무키를 판매자·원 거래 라인·정산 항목·정산 종류 등 실제 처리 단위로 정의하고 UNIQUE·조건부 상태 전이로 원자적 확정한다. 완료 여부 선조회는 보조 검사다"
        - "배치 실행 ID는 추적용이다. 새 실행 ID로 다시 시작하거나 두 워커가 동시에 미완료를 읽어도 같은 업무 효과를 중복 확정하지 않는다"
        - "대용량 처리: 주문 건수가 많을 때 페이징 처리 필수 (전체 조회 금지)"
        - "실패 복구: 안정적인 대상 스냅샷·cutoff와 cursor를 정의한다. chunk 결과와 체크포인트를 같은 트랜잭션으로 커밋하거나 업무키 기반 재처리로 커밋 경계 차이를 견딘다"
        - "동시 환불·상태 변경은 스냅샷·버전·필요 범위의 잠금으로 산정 경계를 고정하고 이후 거래는 별도 보정으로 반영한다. 배치 전체 시간 동안 모든 주문 변경을 막을 필요는 없다"
        - "정산 상태 예시: UNSETTLED → SETTLEMENT_PENDING → SETTLED(정산액 확정). 지급 상태와 보류는 별도 관리하고 반품은 원 확정 내역을 참조하는 보정 원장으로 남긴다"
      avoid-patterns:
        - "전체 주문 한 번에 조회 — 대용량 데이터 OOM 발생"
        - "배치 중복 실행 시 멱등성 처리 누락 — 중복 정산 발생"
      checklist:
        - "정산 배치에 멱등성 처리가 있는가? (중복 실행 방지)"
        - "실행 ID가 달라도 같은 업무키의 효과를 한 번만 확정하는가?"
        - "chunk 결과와 체크포인트의 커밋 경계를 재시작 시 견디는가?"
        - "대용량 주문 처리 시 페이징이 적용됐는가?"
        - "정산 상태 전이 흐름이 정의됐는가? (UNSETTLED → SETTLED)"
      tags: [settlement, batch, cycle, idempotency, cursor]

    - id: settlement-integrity
      category: integrity
      title: "정산 데이터 정합성 검증"
      summary: "정산 완료 후 금액·건수 정합성을 검증하고 타임존을 일관되게 적용해야 한다"
      severity: high
      applicability:
        applies-when: ["판매·환불·공제·보정·지급 원장과 미지급 잔액을 대사한다."]
        assumptions: ["정산 거래 단위와 산정 기간·포함 항목·부담 주체를 정의한다."]
      guidance:
        - "금액 정합성: 매출·할인·배송비·세금·수수료의 포함 항목과 부담 주체를 정의하고 확정액·보정·보류·지급·미지급 잔액을 원장으로 대사한다. 수수료를 공제 합계에도 포함해 두 번 더하지 않는다"
        - "건수와 중복은 판매자·원 거래 라인·정산 항목·종류 등 거래 단위로 검증한다. 같은 주문의 복수 판매자·부분 정산·환불 보정은 정상적인 여러 레코드일 수 있다"
        - "누락은 정의한 기준 이벤트와 cutoff의 대상 집합 대비 확정·보류·차기 처리·실패 집합으로 검증하고 각 차이의 사유를 추적한다"
        - "정산 잔액 대사 예시: 기초 잔액 + 당기 확정액 + 보정액 - 별도 확정 공제 - 성공 지급 누계 = 기말 잔액. 지급 보류·진행 중 이체는 미지급 잔액의 구성으로 추적하고 성공 지급으로 세지 않는다"
        - "음수 기말 잔액은 회수 채권·차기 상계 등 정책상 잔액으로 구분한다. 지급 보류액을 공제와 미지급 잔액 양쪽에 중복 차감하지 않는다"
        - "타임존(UTC vs KST)을 서비스 전반에서 일관되게 적용"
      avoid-patterns:
        - "거래 스냅샷·버전·후속 보정 없이 변경 중인 주문 값을 섞어 산정"
        - "UTC/KST 혼용 — 타임존 설정 오류로 정산 기준일 경계값 오차"
        - "정산 기준일 경계값 처리 오류 (23:59:59 vs 24:00:00)"
      checklist:
        - "정산 완료 후 금액/건수 정합성 검증 로직이 있는가?"
        - "타임존(UTC/KST)이 일관되게 적용됐는가?"
      tags: [settlement, integrity, validation, timezone]

    - id: settlement-statement
      category: statement
      title: "정산 명세서 — 시점 스냅샷으로 박제한다"
      summary: "정산 명세서는 매번 재계산하지 말고 정산 확정 시점의 금액·요율을 불변 스냅샷으로 저장해야 한다"
      guidance:
        - "명세 구성: 정산 ID + 셀러 ID + 정산 기준 기간 + 원 거래 라인(판매금액·수수료·공제) + 확정 순액 breakdown. 명세의 금액이 실제 이체액과 같은 범위인지 정의한다"
        - "스냅샷 저장: 명세 생성 시점의 수수료율, 쿠폰/프로모션 분담률, 적용 금액을 컬럼에 그대로 기록 — 이후 정책이 바뀌어도 과거 명세는 불변"
        - "판매·반품·수수료·분담금·배송비·세금의 포함/제외를 항목별로 명시해 할인·공제를 중복 반영하지 않는다"
        - "셀러 조회 API: 본인 정산 명세만 조회(소유권 검증), 기간·상태 필터, cursor 페이징"
        - "명세-원장 정합성: 기초 이월 + 명세 확정액 + 보정액 - 명세 후 별도 확정 공제 = 성공 지급 누계 + 기말 정산 잔액. 확정 순액에 이미 포함한 세금·상계를 다시 공제하지 않는다"
        - "분할 지급·합산 지급은 명세와 지급 원장의 배부 링크로 대사한다. 양수 기말 잔액의 미지급 잔액·보류·진행 중 이체·차기 이월을 구분하고 음수는 회수·상계 잔액으로 관리한다"
        - "명세는 생성 후 수정 불가(append-only) — 정정이 필요하면 보정 명세를 새로 발행"
      avoid-patterns:
        - "명세를 조회할 때마다 현재 요율로 재계산 — 수수료율이 바뀌면 과거 명세 금액이 흔들려 셀러 분쟁 발생"
        - "명세 라인 없이 합계 금액만 저장 — 셀러가 '왜 이 금액인지' 검증 불가, CS 폭증"
        - "명세를 가변(mutable) 레코드로 두고 in-place 수정 — 감사 추적 불가, 정정 이력 소실"
      checklist:
        - "정산 명세가 생성 시점의 요율·금액을 스냅샷으로 박제하는가?"
        - "명세에 주문별 라인과 공제 breakdown이 남는가?"
        - "명세·보정·성공 지급 누계·미지급 잔액을 분할/이월과 중복 공제 없이 대사하는가?"
        - "셀러 명세 조회에 소유권 검증이 있는가?"
      tags: [settlement, statement, snapshot, immutable, breakdown, seller]
      aliases: [정산서, 과거 명세]

    - id: settlement-tax
      category: tax
      title: "정산 세무 처리 — 부가세·원천징수·면세 구분"
      summary: "정산 세무 데이터는 상품 과세 유형과 거래 당사자 관계를 분리 기록하되 실제 신고·발행·원천징수 기준은 최신 법령과 세무 검토로 확정한다"
      severity: high
      status: needs-review
      applicability:
        applies-when:
          - "국내 셀러 정산에서 과세·면세·수수료·지급액을 계산하거나 세무 자료를 생성한다."
        does-not-apply-when:
          - "플랫폼이 판매 당사자가 아니거나 정산·세금계산서 책임이 계약상 다른 주체에 있는 경우 세부 처리 방식이 달라질 수 있다."
        assumptions:
          - "국세청 최신 안내, 거래 구조, 셀러 사업자 유형과 세무 전문가 검토를 기준으로 확정한다."
        jurisdiction: KR
      guidance:
        - "공급가액·부가세·면세 금액을 분리 저장하고 계산에 사용한 tax_type과 세율 버전을 스냅샷으로 남긴다"
        - "상품의 과세·면세 판정은 단순 카테고리 예시가 아니라 관리되는 세무 정책과 최신 법령을 기준으로 한다"
        - "세금계산서 발행 주체·시점·합산 방식·역발행 여부는 거래 구조와 계약을 기준으로 정의한다"
        - "원천징수 대상과 세율을 개인 여부만으로 단정하지 않고 소득 유형·사업자 지위·최신 세법을 확인한다"
        - "중개수수료의 과세 대상·포함/별도 가격·증빙 발행 주체는 거래 구조와 최신 세무 검토로 정하고 수수료와 부가세를 중복 공제하지 않는다"
        - "세무 자료의 보존 기간과 원본성 요건은 최신 법정 기준으로 관리하고 정책 버전과 적용 기간을 기록한다"
      avoid-patterns:
        - "부가세 포함/별도를 혼동 — 공급가액 기준 수수료 계산과 결제금액 기준 계산이 섞이면 정산액 오차"
        - "면세 상품에 부가세를 부과하거나, 과세 상품의 부가세를 누락"
        - "개인 셀러라는 이유만으로 원천징수하거나 원천징수 적용 대상 소득을 누락 — 소득 유형·지위·최신 근거 없이 판단"
        - "거래 구조 검토 없이 세금계산서 발행 시점을 정산 확정 또는 결제 시점으로 일괄 고정"
      checklist:
        - "정산에 공급가액과 부가세가 분리 기록되는가?"
        - "면세/과세 상품 구분이 정산 계산에 반영되는가?"
        - "원천징수 적용 대상·소득 유형·의무자와 최신 공식 근거를 확인했는가?"
        - "세금계산서 발행 주체와 시점이 거래 구조·계약·최신 세법에 근거하는가?"
      tags: [settlement, tax, vat, withholding, tax-invoice, exemption]

    - id: settlement-hold
      category: hold
      title: "정산 보류 — 분쟁·클레임 중인 건은 지급에서 제외한다"
      summary: "반품·클레임·분쟁에 대한 산정 제외와 지급 보류를 구분하고 계약상 사유·범위·권한·해제 시점을 추적한다"
      guidance:
        - "산정 대상에서 제외할지, 확정액은 유지하고 지급 보류할지는 계약으로 구분한다. 반품 요청 자체를 모든 정산 중단의 근거로 단정하지 않는다"
        - "주문·항목·셀러 단위 보류 사유와 금액 범위·한도를 정의한다. 전체 보류와 부분 보류는 계약상 근거와 권한을 확인한다"
        - "보류 해제는 즉시·예정일·차기 주기 등 계약상 시점으로 결정하고 동일 보류액을 중복 해제하거나 다시 공제하지 않는다"
        - "보류·해제 상태 전이에 사유·행위자·권한·시각·대상 금액의 감사 로그를 남긴다"
        - "보류액은 미지급 잔액 안에서 별도 식별한다. 충당금 등 회계 계정 분류는 회계 정책 검토로 결정하며 보류와 공제를 혼용하지 않는다"
      avoid-patterns:
        - "계약상 필요한 보류를 누락하거나 지급 후 반품의 회수 경로를 정의하지 않음"
        - "계약상 근거·권한 없이 한 주문 문제로 셀러 전체 금액을 보류"
        - "보류 사유·해제 이력 미기록 — 셀러 분쟁 시 근거 제시 불가"
      checklist:
        - "반품/클레임/분쟁의 산정 제외와 지급 보류를 계약에 따라 구분하는가?"
        - "셀러 단위 보류와 주문 단위 보류가 분리됐는가? (부분 보류 가능)"
        - "보류 해제 시점·권한·금액이 계약에 맞고 중복 해제·공제를 방지하는가?"
        - "보류 사유와 해제 이력이 감사 로그로 남는가?"
      tags: [settlement, hold, dispute, chargeback, claim, audit]

    - id: settlement-payout
      category: payout
      title: "정산 지급(실이체) — 확정과 이체를 분리하고 멱등하게"
      summary: "정산 확정과 실제 은행 이체는 상태를 분리하고, 이체 결과 확인 전에는 완료로 처리하지 않으며 이중 지급을 멱등 키로 막아야 한다"
      guidance:
        - "상태 분리: 정산 확정(SETTLED)은 금액 확정이며 이체 완료가 아니다. 지급 시도는 PAYOUT_REQUESTED·PROCESSING·PAID·FAILED·UNCERTAIN 등으로 별도 기록한다"
        - "이체 전 지급 업무키·요청 금액·계좌 버전 등 요청 지문과 동일 지급 시도를 영속 기록하고 원자적으로 선점한다. DB UNIQUE 제약은 내부 기록의 중복 방어이며 외부 이체의 한 번 실행을 단독 보장하지 않는다"
        - "외부 기관의 멱등성 지원 범위·조회 계약에 맞춰 동일 지급 시도에 같은 업무키를 사용한다. 미확정 이체는 기존 거래를 조회하고 새 시도 ID로 다시 송금하지 않는다"
        - "명확한 거절·확정 실패와 응답 유실을 구분한다. 확정 실패 후 계약에 맞게 재시도하며 이미 성공한 시도의 완료 처리만 재실행할 수 있어야 한다"
        - "분할 지급·합산 지급은 지급 항목과 명세 배부를 구분한다. 성공 지급 누계 + 처리 중·미확정 지급 확보액 + 새 요청액이 계약상 배부된 지급 한도(기지급분 차감 전, 보류·공제 반영 후)를 초과하지 않도록 원자적으로 검증한다"
        - "결과 불명확(이체 요청 후 응답 없음): UNCERTAIN 상태로 두고 은행 거래 내역 조회로 확정한다. 실패로 간주해 확보액을 해제하거나 성공 지급으로 임의 집계하지 않는다"
        - "최소 지급액과 소액 이월(carry-over)은 계약과 비용 정책에 따라 적용한다. 기말 미지급 잔액과 보류·진행 중 금액을 구분하고 음수 정산액을 송금하지 않는다"
        - "원천징수 적용 대상과 소득 유형을 확인한 경우에만 세무 정책에 따른 실이체액을 산정한다. 확정액에 이미 반영한 세금·공제를 다시 차감하지 않는다"
        - "지급대행/PG 정산금과 플랫폼 자체 지급을 구분 — 자금 출처와 책임 주체 분리"
      avoid-patterns:
        - "정산 확정 SETTLED를 이체 완료 PAID로 간주해 미지급 잔액을 누락"
        - "멱등 키 없이 배치 재실행 — 같은 정산 건이 두 번 이체돼 과다 지급"
        - "이체 실패를 단순 예외로 흘림 — 미지급 잔액 추적 불가"
        - "대상 여부나 이미 반영한 세금을 확인하지 않고 원천징수를 일괄 추가 차감"
        - "미확정 이체를 새 업무키로 다시 전송하거나 선조회만으로 지급 가능 잔액을 보호"
      checklist:
        - "정산 확정과 실제 이체 상태가 분리돼 있는가?"
        - "지급 업무키·원자적 선점과 외부 멱등/조회 계약으로 같은 이체의 중복 실행을 막는가?"
        - "이체 결과 확인 전에는 완료로 처리하지 않는가? (불명확 시 UNCERTAIN)"
        - "원천징수 적용 대상·소득 유형·의무자와 최신 공식 근거를 확인했는가?"
        - "명세·보정·성공 지급 누계·미지급 잔액을 분할/이월과 중복 공제 없이 대사하는가?"
        - "미확정 지급 확보액을 보존하고 동일 시도를 조회한 뒤 확정하는가?"
      tags: [settlement, payout, transfer, idempotency, uncertain, carry-over, withholding]

    - id: settlement-ai-pitfalls-checklist
      category: checklist
      title: "정산 구현 체크리스트"
      summary: "정산 구현 완료 후 반드시 점검할 체크리스트"
      checklist:
        - "정산 기준일 유형(구매 확정/배송 완료/결제 완료)이 명확히 정의됐는가?"
        - "산정 기준일·확정일·예정/실제 지급일과 영업일 조정 정책이 구분되는가?"
        - "정산 배치에 멱등성 처리가 있는가? (중복 실행 방지)"
        - "대용량 주문 처리 시 페이징이 적용됐는가?"
        - "이미 정산·지급된 건의 반품을 원 거래와 연결해 계약상 보정·상계·회수하는가?"
        - "쿠폰/프로모션 분담금 비율 계산 로직이 있는가?"
        - "정산 공제 후 음수 발생 케이스가 처리됐는가?"
        - "정산 완료 후 금액/건수 정합성 검증 로직이 있는가?"
        - "타임존(UTC/KST)이 일관되게 적용됐는가?"
        - "정산 상태 전이 흐름이 정의됐는가? (UNSETTLED → SETTLED)"
        - "정산 명세가 생성 시점의 요율·금액을 스냅샷으로 박제하는가?"
        - "정산에 공급가액·부가세가 분리되고 과세·면세·포함/별도 정책이 기록되는가?"
        - "원천징수 적용 대상·소득 유형·의무자와 최신 공식 근거를 확인했는가?"
        - "반품/클레임/분쟁의 산정 제외와 지급 보류를 계약에 따라 구분하는가?"
        - "정산 확정과 실제 이체가 분리되고 지급이 멱등한가? (이중 이체 방지)"
        - "실행 ID가 달라도 같은 업무키의 효과를 한 번만 확정하는가?"
        - "명세·보정·성공 지급 누계·미지급 잔액을 분할/이월과 중복 공제 없이 대사하는가?"
        - "미확정 지급 확보액을 보존하고 동일 시도를 조회한 뒤 확정하는가?"
      tags: [checklist, pitfalls, settlement, review]
      aliases: [정산 체크리스트, 정산 점검표, settlement checklist]
